      .tooltip {
        position: fixed !important;
        top: 0;
        height: 100vh;
        box-sizing: border-box;
        padding: 3vh 24px;

        pointer-events: none;

      .tooltip-right { left: 50vw; width: 50vw; font-family: "Fira Code", monospace; }
      .tooltip-center {
        position: fixed;
        left: 50%;
        top: 40vh;

        font-family: "Fira Code", monospace;
        font-size: 14px;
        line-height: 1.5;
        pointer-events: none;
        z-index: 1000;
      }
      .tooltip img, .tooltip video { max-width: 100%; height: auto; }
